services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: chronocommerce
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # files here run once, alphabetically, on first start of an empty volume
      - ./migrations:/docker-entrypoint-initdb.d:ro
volumes:
  pgdata:
